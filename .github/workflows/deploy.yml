name: ビルド検証

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ビルド検証
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      - name: ビルド（Vercel本番ビルドと同じ設定）
        run: npx next build
        env:
          CMS_API_URL: ${{ secrets.CMS_API_URL }}
