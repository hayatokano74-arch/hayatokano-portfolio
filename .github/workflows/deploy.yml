name: ビルド検証

# トリガー
# push to main: コード変更時にビルドが通ることを検証する
# ※ Xserver は SSH 接続元 IP 制限があるため GitHub Actions からの rsync は不可。
#   デプロイは手元で ./deploy.sh を実行する。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: 静的ビルド検証
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ────────────────────────────────────────────
      # 1. コードを取得
      # ────────────────────────────────────────────
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # ────────────────────────────────────────────
      # 2. Node.js セットアップ
      # ────────────────────────────────────────────
      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      # ────────────────────────────────────────────
      # 3. 静的サイトをビルド（ビルドが通ることだけ確認）
      #    CMS_API_URL が未設定でも静的ビルドは完了する（フォールバック動作）
      # ────────────────────────────────────────────
      - name: 静的サイトをビルド
        run: STATIC_EXPORT=true npx next build
        env:
          CMS_API_URL: ${{ secrets.CMS_API_URL }}

      - name: ビルド完了
        run: echo "✅ ビルド検証完了。デプロイは ./deploy.sh で実行してください。"
