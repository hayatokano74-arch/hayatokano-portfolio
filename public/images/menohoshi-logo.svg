<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>目の星 / Menohoshi Logo</title>

  <!-- 目の外形（ヴェシカ・パイシス）
       2つの円(cx=140,r=200 と cx=260,r=200)の交差で形成
       交点を計算: x=200, y_offset = sqrt(200^2 - 60^2) = sqrt(36400) ≈ 190.79
       上: (200, 200-190.79) = (200, 9.21)
       下: (200, 200+190.79) = (200, 390.79) -->
  <path d="
    M 200 9.21
    A 200 200 0 0 1 200 390.79
    A 200 200 0 0 1 200 9.21
    Z
  " fill="#141414"/>

  <!-- 虹彩リング -->
  <circle cx="200" cy="200" r="112" fill="#f5f5f5"/>

  <!-- 瞳孔 -->
  <circle cx="200" cy="200" r="64" fill="#141414"/>

  <!-- キャッチライト（目の星） -->
  <circle cx="226" cy="174" r="22" fill="#f5f5f5"/>

</svg>